<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  入管の参考様式が前提にしているフォント（Windows の MS フォント）を、イメージに入れた
  フォントで置き換える（ADR-0018）。LibreOffice headless の PDF 変換で使う。
  ＭＳ 明朝 → IPA明朝、ＭＳ Ｐ明朝 → IPAP明朝、ＭＳ ゴシック → IPAゴシック、
  ＭＳ Ｐゴシック → Noto Sans CJK JP、SimSun（中国語）→ Noto Serif CJK SC、Calibri → Carlito。
  ＭＳ Ｐゴシックは第1-17号のブックの既定のフォントで、列幅の計算に使われる。IPAPゴシックでは
  列が広くなり頁が倍（21 頁）になったため、列幅が合う Noto Sans CJK JP にした（ADR-0018）。
  游ゴシック（Light を含む）→ Noto Sans CJK JP、游明朝 → Noto Serif CJK JP（2026-10-20 に足した。
  ADR-0032 の追記）。游ゴシックは提出書類一覧表のブックの既定のフォントで、置き換えが無いと
  DejaVu Sans で描かれ、列が Excel より広くなっていた。游明朝は日中併記の様式・第1-26号の
  テーマのフォント。足しても Word の様式の頁数・頁の割れ方は変わらない。
-->
<fontconfig>
  <alias binding="same"><family>ＭＳ 明朝</family><prefer><family>IPAMincho</family></prefer></alias>
  <alias binding="same"><family>MS Mincho</family><prefer><family>IPAMincho</family></prefer></alias>
  <alias binding="same"><family>ＭＳ Ｐ明朝</family><prefer><family>IPAPMincho</family></prefer></alias>
  <alias binding="same"><family>MS PMincho</family><prefer><family>IPAPMincho</family></prefer></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><prefer><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>IPAGothic</family></prefer></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS PGothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>游ゴシック</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>游ゴシック Light</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic Light</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>游明朝</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
</fontconfig>
