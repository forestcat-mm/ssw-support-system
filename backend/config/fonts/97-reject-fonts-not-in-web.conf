<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  web のイメージ（本番と同じ）に無い字体を使わせない（ADR-0048）。e2e のイメージ（Ubuntu の
  Playwright の基のイメージ）とクラウドの VM（tools/cloud/setup.sh）に置き、帳票の PDF を web と同じ
  字体で描かせる。web のイメージには置かない（もともと無い字体なので要らない）。
  web にある字体: Carlito・DejaVu（Sans・Sans Mono・Serif）・IPA（4 つ）・Liberation（Sans・Serif・
  Mono）・Noto CJK（Sans・Sans Mono・Serif の各地域）・OpenSymbol。
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/wqy*</glob>
      <glob>*/WenQuanYi*</glob>
      <glob>*/freefont/*</glob>
      <glob>*/unifont*</glob>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Sharp</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSans</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSerif</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeMono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont Upper</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont CSUR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont Sample</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont-JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Bitstream Charter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Courier 10 Pitch</string></patelt></pattern>
      <pattern><patelt name="family"><string>Loma</string></patelt></pattern>
      <pattern><patelt name="family"><string>JetBrains Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Caladea</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
