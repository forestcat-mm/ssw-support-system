[project]
name = "ssw-support-system"
version = "0.1.0"
description = "特定技能 登録支援機関 業務管理システム（MVP）"
requires-python = "==3.12.*"
# 直接依存は == で固定する。間接依存は uv.lock で固定する（更新は make lock）。
dependencies = [
    "django==5.2.18",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    # django-stubs 5.2.x は Django 5.2 用。対応 mypy は >=1.13,<1.20（compatible-mypy extra の宣言）。
    # django-stubs-ext は下限指定のみで 6.x が入るため、django-stubs と同じ版に固定する。
    "django-stubs==5.2.9",
    "django-stubs-ext==5.2.9",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
