[project]
name = "ssw-support-system"
version = "0.1.0"
description = "特定技能 登録支援機関 業務管理システム（MVP）"
requires-python = "==3.12.*"
# 直接依存は == で固定する。間接依存は uv.lock で固定する（更新は make lock）。
dependencies = [
    "cryptography==50.0.2",
    "django==5.2.18",
    "django-axes==8.3.1",
    "django-environ==0.14.0",
    # ModelAdmin[...] / ModelForm[...] を実行時に使うため（settings で monkeypatch()）。django-stubs と同版。
    "django-stubs-ext==5.2.9",
    "django-otp==1.7.4",
    "django-q2==1.11.1",
    "django-storages[s3]==1.14.6",
    "jpholiday==1.0.3",
    "psycopg[binary]==3.3.6",
    "qrcode==8.2",
    "redis==8.1.0",
    "docxtpl==0.20.1",
    "openpyxl==3.1.5",
    "pypdf==6.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    # django-stubs 5.2.x は Django 5.2 用。対応 mypy は >=1.13,<1.20（compatible-mypy extra の宣言）。
    # django-stubs-ext は下限指定のみで 6.x が入るため、本体の依存で django-stubs と同じ版に固定している。
    "django-stubs==5.2.9",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]
# 通しのテスト（make e2e のコンテナだけで入れる）
e2e = [
    "playwright==1.63.0",
    "pytest-playwright==0.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings_test"

[[tool.mypy.overrides]]
module = ["environ", "environ.*", "django_otp.*", "axes.*", "qrcode", "qrcode.*", "playwright.*", "jpholiday"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "--strict-markers"
