# 手元と本番で同じファイルを使う。差分は .env と docker-compose.prod.yml（本番サーバー決定時に作成）に閉じる。
services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Django-Q2 のワーカー（日次の起票などのジョブを実行する。ADR-0005）
  qcluster:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python manage.py qcluster
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 通しのテスト（Playwright）。make e2e で起動する（make up では起動しない）
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: backend/Dockerfile.e2e
    env_file: .env
    command: pytest e2e
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
